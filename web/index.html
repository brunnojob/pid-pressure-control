<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c24"><meta name="description" content="Laboratório interativo de controle PID de pressão / Interactive pressure PID control lab"><title>Pressure Lab · PID</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body><header class="top"><a href="#" class="brand"><span class="mark">P<span>↗</span></span> PRESSURE LAB <small>BY BRUNNODEV</small></a><nav><a href="#learn" data-i18n="navLearn"></a><a href="https://github.com/brunnojob/pid-pressure-control" target="_blank" rel="noopener">GitHub ↗</a><label class="language"><span data-i18n="language"></span><select id="language"><option value="pt">PT-BR</option><option value="en">EN</option></select></label></nav></header>
<main><section class="hero"><div><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1><p class="intro" data-i18n="intro"></p></div><aside class="hero-note"><span class="live-dot"></span><span data-i18n="local"></span><p data-i18n="scope"></p></aside></section>
<section class="lab" aria-labelledby="labTitle"><div class="section-top"><h2 id="labTitle" data-i18n="labTitle"></h2><span class="tag" data-i18n="modelTag"></span></div>
<div class="metrics"><article><span data-i18n="measured"></span><strong><span id="pressure">40.0</span><small>bar</small></strong></article><article><span data-i18n="target"></span><strong><span id="targetValue">120</span><small>bar</small></strong></article><article><span data-i18n="valve"></span><strong><span id="valve">0.0</span><small>%</small></strong></article><article><span data-i18n="error"></span><strong><span id="error">80.0</span><small>bar</small></strong></article></div>
<div class="workspace"><div class="visual"><div class="plot-head"><div class="legend"><span class="key pressure" data-i18n="pressureLegend"></span><span class="key target" data-i18n="targetLegend"></span></div><span id="clock">0.0 s</span></div><div id="chartWrap"><svg id="chart" viewBox="0 0 800 300" role="img" aria-labelledby="chartTitle chartDesc"><title id="chartTitle"></title><desc id="chartDesc"></desc><g id="grid"></g><path id="targetPath"/><path id="pressurePath"/></svg></div><div class="plot-foot"><span data-i18n="chartUnits"></span><span data-i18n="chartWindow"></span></div><div class="plant"><div class="plant-node"><span data-i18n="actuator"></span><strong id="valveNode">0%</strong></div><div class="pipe"><i id="flow"></i></div><div class="vessel"><div id="liquid"></div><strong id="vesselPressure">40 bar</strong><span data-i18n="vessel"></span></div><div class="pipe"></div><div class="plant-node"><span data-i18n="sensor"></span><strong id="sensorState"></strong></div></div><p class="plant-caption" data-i18n="plantCaption"></p><div class="status" role="status" aria-live="polite"><span id="statusDot" class="live-dot"></span><div><strong id="status"></strong><p id="statusDetail"></p></div></div></div>
<aside class="controls"><div class="control-heading"><h3 data-i18n="controls"></h3><span>Δt = 0.1 s</span></div><label class="slider-label" for="setpoint"><span data-i18n="target"></span><output id="setpointOutput">120 bar</output></label><input id="setpoint" type="range" min="0" max="250" value="120" step="1"><div class="range-labels"><span>0 bar</span><span>250 bar</span></div><div class="gains"><label>Kp<input id="kp" type="number" min="0" max="20" step="0.1" value="1.8"></label><label>Ki<input id="ki" type="number" min="0" max="10" step="0.1" value="0.5"></label><label>Kd<input id="kd" type="number" min="0" max="10" step="0.1" value="0.1"></label></div><p class="hint" data-i18n="gainsHint"></p><label class="preset-label" for="preset" data-i18n="preset"></label><select id="preset"><option value="balanced" data-i18n="balanced"></option><option value="gentle" data-i18n="gentle"></option><option value="aggressive" data-i18n="aggressive"></option></select><div class="actions"><button id="play" class="primary"></button><button id="restart" data-i18n="restart"></button></div><h4 data-i18n="scenarios"></h4><button id="load" class="scenario" data-i18n="addLoad"></button><div class="fault-actions"><button id="disconnect" data-i18n="disconnect"></button><button id="stale" data-i18n="stale"></button></div><button id="clearFault" data-i18n="clearFault"></button><p class="hint" data-i18n="faultHint"></p><button id="export" class="export" data-i18n="export"></button></aside></div></section>
<section id="learn" class="learn"><div class="section-top"><div><p class="eyebrow" data-i18n="learnEyebrow"></p><h2 data-i18n="learnTitle"></h2></div><span class="tag">PID / C++20</span></div><div class="explain-grid"><article><span class="number">01</span><h3 data-i18n="step1Title"></h3><p data-i18n="step1"></p><code>e(t) = SP − PV</code></article><article><span class="number">02</span><h3 data-i18n="step2Title"></h3><p data-i18n="step2"></p><code>u = Kp·e + Ki·∫e·dt − Kd·dPV/dt</code></article><article><span class="number">03</span><h3 data-i18n="step3Title"></h3><p data-i18n="step3"></p><code>0 ≤ u ≤ 100%</code></article></div><div class="detail-grid"><article><h3 data-i18n="identTitle"></h3><p data-i18n="ident"></p><pre><code>build/identify_process processo.csv 0.1 &gt; result.json</code></pre><p class="hint" data-i18n="identNote"></p></article><article><h3 data-i18n="limitsTitle"></h3><p data-i18n="limits"></p><p data-i18n="modelDetails"></p><a href="https://github.com/brunnojob/pid-pressure-control/blob/main/src/pid.cpp" target="_blank" rel="noopener" data-i18n="source"></a></article></div></section>
<section class="repository"><div><p class="eyebrow" data-i18n="repoEyebrow"></p><h2 data-i18n="repoTitle"></h2><p id="apiStatus" role="status"></p></div><dl><div><dt data-i18n="version"></dt><dd id="version">—</dd></div><div><dt data-i18n="updated"></dt><dd id="updated">—</dd></div><div><dt data-i18n="checks"></dt><dd id="checks">—</dd></div></dl><a href="https://github.com/brunnojob/pid-pressure-control" target="_blank" rel="noopener" data-i18n="repository"></a></section></main><footer><span>Pressure Lab / <a href="https://brunnodev.store" target="_blank" rel="noopener">brunnodev.store</a></span><span data-i18n="footer"></span></footer><script type="module" src="app.mjs"></script></body></html>
